name: SRE Copilot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'SRE-Copilot-Code/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'SRE-Copilot-Code/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build & Package Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SRE-Copilot-Code
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Code Quality Checks
        run: go vet ./...

      - name: Compile Binary for Linux (GCP VM Target)
        run: |
          mkdir -p build-bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w" \
            -o build-bin/sre-copilot ./cmd/server

      - name: Assemble Complete build-bin Bundle (Binary, Config, Templates, Static, Scripts)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Ensure bundle directories exist
          mkdir -p build-bin/templates build-bin/static
          
          # 2. Package templates, static assets, and deploy script
          cp -r templates/* build-bin/templates/
          cp -r static/* build-bin/static/
          if [ -f scripts/deploy.sh ]; then
            cp scripts/deploy.sh build-bin/deploy.sh
            chmod +x build-bin/deploy.sh
          fi
          
          # 3. Include configuration and inject GEMINI_API_KEY if provided
          if [ -f config.json ]; then
            cp config.json build-bin/config.json
            if [ -n "${GEMINI_API_KEY:-}" ]; then
              jq --arg key "${GEMINI_API_KEY}" '.ai.gemini_api_key = $key' build-bin/config.json > build-bin/config.tmp && mv build-bin/config.tmp build-bin/config.json
              echo "✓ Injected GEMINI_API_KEY into build-bin/config.json"
            fi
          fi

          echo "✓ Assembled complete build-bin bundle contents:"
          ls -la build-bin/
          ls -la build-bin/templates/
          ls -la build-bin/static/

      - name: Upload Complete build-bin Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-bin-bundle
          path: SRE-Copilot-Code/build-bin/
          retention-days: 7

  deploy:
    name: Deploy to GCP VM via Workload Identity & IAP
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: 'yuvaraj-internal-project'
      GCP_ZONE: 'asia-south1-a'
      GCP_VM_NAME: 'sre-copilot-server'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/986244541727/locations/global/workloadIdentityPools/sre-github-pool/providers/sre-github-provider'
          service_account: 'sre-deployer-sa@yuvaraj-internal-project.iam.gserviceaccount.com'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Complete build-bin Bundle
        uses: actions/download-artifact@v4
        with:
          name: build-bin-bundle
          path: build-bin

      - name: Prepare Deployment Configuration and Archive
        run: |
          # 1. Inject GEMINI_API_KEY into config.json if set in secrets
          if [ -n "${GEMINI_API_KEY:-}" ] && [ -f build-bin/config.json ]; then
            jq --arg key "${GEMINI_API_KEY}" '.ai.gemini_api_key = $key' build-bin/config.json > build-bin/config.tmp && mv build-bin/config.tmp build-bin/config.json
            echo "✓ Injected GEMINI_API_KEY into build-bin/config.json"
          fi

          # 2. Package everything into a single compressed tarball for fast atomic transfer
          tar -czf deploy-bundle.tar.gz -C build-bin .
          echo "✓ Created deploy-bundle.tar.gz"

      - name: Transfer Bundle to Server via Identity-Aware Proxy (IAP) Tunnel
        run: |
          echo "Syncing deploy-bundle.tar.gz to GCP VM ($GCP_VM_NAME) via IAP..."
          gcloud compute scp --quiet --tunnel-through-iap \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            deploy-bundle.tar.gz "${GCP_VM_NAME}:/tmp/deploy-bundle.tar.gz"

      - name: Execute Deployment & Restart Services
        run: |
          echo "Extracting bundle and executing deployment..."
          gcloud compute ssh --quiet "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --command="sudo mkdir -p /tmp/deploy-bundle && sudo tar -xzf /tmp/deploy-bundle.tar.gz -C /tmp/deploy-bundle && sudo rm -f /tmp/deploy-bundle.tar.gz && sudo bash /tmp/deploy-bundle/deploy.sh"
